<style>
:root {
    --sun: #F5A623;
    --sky: #1A6BAB;
    --earth: #2D4A1E;
    --warm: #F7F3ED;
    --cream: #FEFCF8;
    --dark: #1C1C1E;
    --mid: #4A4A52;
    --soft: #8A8A92;
    --border: #E5DDD4;
    --card: #FFFFFF;
    --red: #C0392B;
    --green: #27AE60;
    --teal: #16A085;
    --purple: #8E44AD;
    --orange: #E67E22;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'DM Sans', sans-serif;
    background: var(--warm);
    color: var(--dark);
    min-height: 100vh;
    overflow-x: hidden;
}

/* HEADER */
header {
    background: var(--sky);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,.18);
}

.header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 clamp(12px, 3vw, 24px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: clamp(56px, 8vw, 68px);
    gap: clamp(8px, 2vw, 16px);
}

.logo {
    display: flex;
    align-items: center;
    gap: clamp(6px, 1.5vw, 10px);
    text-decoration: none;
    flex-shrink: 0;
    min-width: 0;
}

.logo-icon {
    width: clamp(28px, 5vw, 38px);
    height: clamp(28px, 5vw, 38px);
    background: transparent;
    border-radius: 0;
    display: flex; 
    align-items: center; 
    justify-content: center;
    font-size: clamp(20px, 4vw, 28px);
    flex-shrink: 0;
    animation: sunflowerBob 2.8s ease-in-out infinite;
}

.logo-text {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(11px, 2.2vw, 18px);
    color: #fff;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.logo-sub {
    font-size: clamp(8px, 1.4vw, 10px);
    font-weight: 400;
    opacity: .75;
    display: block;
    white-space: normal;
    line-height: 1.2;
}

.header-search {
    flex: 1;
    max-width: 400px;
    min-width: 0;
    position: relative;
}

.header-search input {
    width: 100%;
    padding: 9px 16px 9px 40px;
    border-radius: 999px;
    border: none;
    background: rgba(255,255,255,.18);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(12px, 1.8vw, 14px);
    outline: none;
    transition: background .2s;
}

.header-search input::placeholder { color: rgba(255,255,255,.6); }
.header-search input:focus { 
    background: rgba(255,255,255,.32) !important; 
    box-shadow: 0 0 0 3px rgba(245,166,35,.35); 
}

.header-search .s-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: rgba(255,255,255,.7); font-size: 15px; pointer-events: none;
}

.header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
}

/* Add remaining functional CSS blocks correctly nested */
.hero {
    background: linear-gradient(180deg, #1a1438 0%, #3d2b5c 25%, #7c4a6e 50%, #c2683f 72%, #e8943a 88%, #f5b942 100%);
    padding: 72px 20px 0;
    text-align: center;
    position: relative;
    overflow: hidden;
    min-height: 460px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.hero-content {
    position: relative;
    z-index: 2;
    padding-bottom: 100px;
}

.hero h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(32px, 6vw, 58px);
    color: #fff;
    margin-bottom: 16px;
    line-height: 1.1;
    position: relative;
    animation: fadeSlideDown .7s .1s ease both;
}

@keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes sunflowerBob {
    0%, 100% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-5px) scale(1.08); }
    70% { transform: translateY(-2px) scale(1.03); }
}

/* Ensure global box sizing covers mobile properly */
html, body { overflow-x: hidden; width: 100%; }
*, *::before, *::after { box-sizing: border-box; }

@media (max-width: 480px) {
    .header-inner { padding: 0 12px; height: 52px; gap: 8px; }
    .header-search { display: none; }
    .logo-sub { display: none; }
    .logo-text { font-size: 13px; }
    .logo-icon { font-size: 22px; width: 26px; height: 26px; }
    .hero { padding: 24px 14px 0; min-height: 300px; }
    .hero h1 { font-size: 26px; }
}
